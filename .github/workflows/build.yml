name: Build and publish LiteToolbox
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version, for example v0.4.0'
        required: true
        default: v0.4.0
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize browsable source if a browser-uploaded bundle is present
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source-bundle.zip ]; then
            test "$GITHUB_REF_TYPE" = branch
            python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          root = Path.cwd()
          with zipfile.ZipFile('source-bundle.zip') as bundle:
              for entry in bundle.infolist():
                  path = PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'lite-toolbox':
                      raise ValueError('Unexpected archive path')
                  relative = Path(*path.parts[1:])
                  if not relative.parts or relative.parts[0] in {'.git', '.github'} or entry.is_dir():
                      continue
                  target = root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(entry))
                  target.chmod(((entry.external_attr >> 16) & 0o777) or 0o644)
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm source-bundle.zip
            git add .
            git commit -m "Publish LiteToolbox v0.4 source"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LiteToolbox-Windows-x64
          - os: macos-14
            artifact: LiteToolbox-macOS-ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test file processing
        run: python -m unittest discover -s tests -v
      - name: Test editing logic
        run: |
          node tests/check_photo.cjs
          node tests/check_pdf_workspace.cjs
          node tests/check_pdf_free_crop.cjs
      - name: Build native app
        run: python build.py
      - name: Test the packaged processing engine
        run: python scripts/package_smoke.py
      - name: Package macOS bundle preserving permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/LiteToolbox.app dist/LiteToolbox-macOS-ARM64.zip
      - name: Package Windows application folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/LiteToolbox -DestinationPath dist/LiteToolbox-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: LiteToolbox-*
          merge-multiple: true
          path: release
      - name: Add source archive and checksums
        run: |
          python3 - <<'PY'
          import hashlib, subprocess, zipfile
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('release/LiteToolbox-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for filename in files:
                  if filename:
                      z.write(filename, 'lite-toolbox/' + filename)
          sums = []
          for file in sorted(Path('release').glob('*.zip')):
              sums.append(hashlib.sha256(file.read_bytes()).hexdigest() + '  ' + file.name)
          Path('release/SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY
      - name: Publish both platform downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a version such as v0.4.0'; exit 1; }
          gh release create "$RELEASE_TAG" \
            release/LiteToolbox-Windows-x64.zip \
            release/LiteToolbox-macOS-ARM64.zip \
            release/LiteToolbox-Source.zip \
            release/SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title "LiteToolbox $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
